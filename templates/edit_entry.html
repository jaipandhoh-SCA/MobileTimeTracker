{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Edit Time Entry</h1>
    
    <div class="bg-white rounded-lg shadow p-6">
        <div class="mb-4 p-4 bg-blue-50 border-l-4 border-blue-500">
            <p class="text-sm text-blue-800"><strong>Rep:</strong> {{ entry.user.display_name }}</p>
            <p class="text-sm text-blue-800"><strong>Created:</strong> {{ entry.created_at|format_datetime }}</p>
        </div>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            {% if return_url %}
            <input type="hidden" name="return_url" value="{{ return_url }}"/>
            {% endif %}
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Date *</label>
                <input type="date" name="date" value="{{ entry.date }}" class="w-full p-3 border border-gray-300 rounded-lg" required>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Client</label>
                <select name="client_id" class="w-full p-3 border border-gray-300 rounded-lg">
                    <option value="">Daily Activities</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}" {% if entry.client_id == client.id %}selected{% endif %}>{{ client.name }} - {{ client.address }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Work Description *</label>
                <textarea name="work_description" rows="4" class="w-full p-3 border border-gray-300 rounded-lg" required>{{ entry.work_description }}</textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Duration (hours) *</label>
                <input type="number" name="duration_hours" step="0.25" value="{{ entry.duration_hours }}" class="w-full p-3 border border-gray-300 rounded-lg" required>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg">
                    Update Entry
                </button>
                <a href="{{ url_for('admin_dashboard') }}" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-3 px-6 rounded-lg text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
