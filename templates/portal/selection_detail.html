{% extends "portal/base.html" %}
{% block title %}{{ category.name }} — Selections{% endblock %}

{% block content %}
<a href="{{ url_for('portal.selections') }}" class="text-sm text-gray-500 hover:text-gray-700 mb-4 inline-block">&larr; Back to Selections</a>

<h1 class="text-2xl font-bold text-gray-900 mb-2">{{ category.name }}</h1>
{% if category.description %}
<p class="text-gray-500 text-sm mb-6">{{ category.description }}</p>
{% endif %}

<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {% for option in options %}
        <label class="block cursor-pointer">
            <input type="radio" name="option_id" value="{{ option.id }}" class="peer sr-only"
                   {% if current and current.option_id == option.id %}checked{% endif %}
                   required>
            <div class="bg-white rounded-2xl shadow-sm border-2 border-gray-200 p-4
                        peer-checked:border-blue-500 peer-checked:bg-blue-50/30
                        hover:shadow-md transition-all">
                {% if option.image_key %}
                <div class="aspect-video bg-gray-100 rounded-lg overflow-hidden mb-3">
                    <img src="{{ generate_presigned_url(option.image_key) }}"
                         alt="{{ option.name }}" class="w-full h-full object-cover" loading="lazy">
                </div>
                {% endif %}
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900">{{ option.name }}</h3>
                        {% if option.description %}
                        <p class="text-xs text-gray-400 mt-0.5">{{ option.description }}</p>
                        {% endif %}
                    </div>
                    <div class="text-sm font-semibold whitespace-nowrap ml-3
                                {% if option.price_delta > 0 %}text-amber-600{% elif option.price_delta < 0 %}text-green-600{% else %}text-gray-400{% endif %}">
                        {% if option.price_delta > 0 %}+${{ '{:,.0f}'.format(option.price_delta) }}
                        {% elif option.price_delta < 0 %}-${{ '{:,.0f}'.format(option.price_delta|abs) }}
                        {% else %}Included{% endif %}
                    </div>
                </div>
                {% if option.is_default %}
                <span class="inline-flex items-center mt-2 px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-gray-100 text-gray-500">Standard</span>
                {% endif %}
            </div>
        </label>
        {% endfor %}
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
        <textarea name="note" rows="2"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Any preferences or questions...">{{ current.note if current and current.note else '' }}</textarea>
    </div>

    <button type="submit"
            class="w-full py-3 px-4 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-800 transition-colors">
        Submit Selection
    </button>
</form>
{% endblock %}
