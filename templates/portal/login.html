<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@4" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm mx-auto px-4">
        <div class="text-center mb-8">
            <h1 class="text-xl font-bold text-gray-900">All Inclusive ADU</h1>
            <p class="text-sm text-gray-500 mt-1">Client Portal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="mb-3 p-3 rounded-xl text-sm {% if category == 'error' %}bg-red-50 text-red-700{% elif category == 'info' %}bg-blue-50 text-blue-700{% else %}bg-green-50 text-green-700{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="bg-white rounded-2xl border border-gray-200 p-6">
            <h2 class="text-base font-semibold text-gray-900 mb-4">Sign in to your project</h2>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                    <input type="email" name="email" required autofocus
                           class="w-full px-3 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-900 focus:border-gray-900 text-sm bg-gray-50"
                           placeholder="your@email.com">
                </div>
                <button type="submit"
                        class="w-full py-2.5 px-4 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-800 transition-colors text-sm">
                    Send Login Link
                </button>
                <p class="text-xs text-gray-400 text-center mt-3">
                    We'll email you a secure link. No password needed.
                </p>
            </form>
        </div>
    </div>
</body>
</html>
